name: Check TUF freshness

# Secrets-free safety net for the two renewers: every day, read the published
# metadata expiry dates and open (or update) an issue when a role is closer to
# expiry than its renewer ever lets it get. The weekly online workflow keeps
# timestamp above 23 days and snapshot above 83; the key-holding operator
# machine's host-tuf-renewal task keeps targets above 90. Alerts fire at 10, 30
# and 75 days, and for root (offline ceremony) at 180. The issue closes itself
# once every role is healthy again.

on:
  schedule:
    - cron: "43 5 * * *" # daily, 05:43 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch LFS metadata only
        # host-updates/v1/metadata/*.json is LFS-tracked; without it the runner
        # sees pointer files and metadata parsing fails. `lfs: true` would also
        # download every ~430 MB host bundle, and each download counts against
        # the account's LFS bandwidth, so pull the metadata alone.
        run: |
          git lfs install --local
          git lfs pull --include "host-updates/v1/metadata/*"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Evaluate metadata expiry dates
        id: expiry
        run: |
          python - <<'PY' | tee expiry-report.txt
          import datetime as dt
          import json
          from pathlib import Path

          WARN_DAYS = {"timestamp": 10, "snapshot": 30, "targets": 75, "root": 180}
          now = dt.datetime.now(dt.timezone.utc)
          directory = Path("host-updates/v1/metadata")

          def signed(name):
              return json.loads((directory / name).read_text())["signed"]

          timestamp = signed("timestamp.json")
          snapshot_version = timestamp["meta"]["snapshot.json"]["version"]
          snapshot = signed(f"{snapshot_version}.snapshot.json")
          targets_version = snapshot["meta"]["targets.json"]["version"]
          roles = {
              "timestamp": ("timestamp", timestamp),
              f"snapshot v{snapshot_version}": ("snapshot", snapshot),
              f"targets v{targets_version}": ("targets", signed(f"{targets_version}.targets.json")),
              "root v1": ("root", signed("1.root.json")),
          }
          stale = []
          for name, (role, doc) in roles.items():
              expires = dt.datetime.fromisoformat(doc["expires"].replace("Z", "+00:00"))
              remaining = expires - now
              state = "EXPIRED" if remaining < dt.timedelta() else f"{remaining.days}d left"
              print(f"{name}: expires {doc['expires']} ({state})")
              if remaining < dt.timedelta(days=WARN_DAYS[role]):
                  stale.append(
                      f"- **{name}** expires `{doc['expires']}` "
                      f"({state}; alert at {WARN_DAYS[role]}d)"
                  )
          Path("stale.md").write_text("\n".join(stale))
          PY
          if [ -s stale.md ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Open, update, or close the freshness issue
        env:
          GH_TOKEN: ${{ github.token }}
          STALE: ${{ steps.expiry.outputs.stale }}
        run: |
          title="TUF metadata approaching expiry"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ "$STALE" != "true" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "Every feed trust role is outside its alert window again. _Automated by check-tuf-freshness._"
            fi
            exit 0
          fi
          body="$(printf 'The following feed trust metadata is closer to expiry than its renewer should ever let it get:\n\n%s\n\n- **timestamp / snapshot**: the weekly **Refresh TUF metadata** workflow or its secrets need attention. The operator machine also refreshes them once they are a week from expiry.\n- **targets**: the host-tuf-renewal task on the key-holding operator machine has not renewed it. Run `npm run host-tuf-renewal -- status` there, and `npm run host-tuf-renewal -- run` to renew now.\n- **root**: schedule the offline root ceremony.\n\nAppliances pause host updates once any role expires; application updates are unaffected.\n\n_Automated by check-tuf-freshness._' "$(cat stale.md)")"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
      - name: Turn the run red when stale
        if: steps.expiry.outputs.stale == 'true'
        run: |
          echo "::error::Feed TUF metadata is inside its alert window; see the freshness issue."
          exit 1
